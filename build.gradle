plugins {
    id 'java'
}

group = 'com.cookie-build'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "opencollab-repo"
        url = uri("https://repo.opencollab.dev/main/")
    }
    ivy {
        name = 'floodgatePinnedSnapshot'
        url = uri('https://repo.opencollab.dev/main/')
        patternLayout {
            artifact 'org/geysermc/floodgate/api/2.2.5-SNAPSHOT/api-[revision].[ext]'
        }
        metadataSources { artifact() }
        content { includeModule('org.geysermc.floodgate', 'api') }
    }
}

configurations {
    embeddedNbt {
        transitive = false
    }
}

dependencies {
    implementation project(path: ':CookieDough', configuration: 'shadow')
    implementation 'net.kyori:adventure-nbt:4.26.1'
    embeddedNbt 'net.kyori:adventure-nbt:4.26.1'
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    compileOnly 'io.papermc.paper:paper-api:26.2.build.116-stable'
    compileOnly('org.geysermc.cumulus:cumulus:1.1.2')
    // Immutable timestamped artifact from the upstream 2.2.5 snapshot repository.
    compileOnly("org.geysermc.floodgate:api:2.2.5-20260809.110940-20") {
        transitive = false
    }
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.papermc.paper:paper-api:26.2.build.116-stable'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.embeddedNbt.collect { zipTree(it) }
    }
    exclude 'META-INF/MANIFEST.MF'
}

test {
    useJUnitPlatform()
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
