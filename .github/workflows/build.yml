name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MicroBattles
        uses: actions/checkout@v6
        with:
          path: MicroBattles

      - name: Check out CookieDough
        uses: actions/checkout@v6
        with:
          repository: Guillaume351/CookieDough
          ref: dev
          path: CookieDough

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        working-directory: MicroBattles
        run: ./gradlew build --no-daemon --warning-mode all
